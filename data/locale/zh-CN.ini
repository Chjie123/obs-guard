Name="违禁内容遮挡"
Description="实时检测指定区域内的违禁目标，并按配置样式遮挡后再送入 OBS 编码"

Sec.Basic="① 基本"
Enabled="启用检测"
DetFps="检测频率"
DetFps.Desc="每秒做多少次推理。遮罩始终每帧绘制，降低此值只减少 GPU/CPU 占用。低配机建议 5~8。"
FailMode="推理不可用时"
FailOpen="直通画面（保直播）"
FailClosed="全屏遮挡（保合规）"
FailMode.Desc="fail-open：模型或推理异常时停止遮挡、画面直通并告警。fail-closed：持续全屏遮挡直到恢复正常。默认 fail-open。"

Sec.Roi="② 检测区域"
CoordMode="坐标系"
CoordPercent="百分比（分辨率无关）"
CoordPixel="像素（源画面坐标）"
CoordMode.Desc="百分比：0~100%%，换分辨率不用改。像素：按当前源分辨率换算；把滤镜挂在「显示器采集」上时，像素坐标就等于屏幕坐标。"
RoiHint="区域从画面左上角算起，宽高按同一坐标系填写。只在该区域内检测与遮挡。"
RoiX="X"
RoiY="Y"
RoiW="宽"
RoiH="高"
RoiPct.Desc="单位：占画面宽/高的百分比。"
RoiPx.Desc="单位：像素。源分辨率变化后需要重新填写。"

Sec.Model="③ 模型"
ModelPath="YOLO 模型（.onnx）"
ModelFilter="ONNX 模型 (*.onnx)"
ModelPath.Desc="用 tools/export_onnx.py 从 .pt 导出。输入尺寸以模型图为准，无需在此填写；类别名会自动从模型 metadata 读取。"
Device="推理设备"
DeviceAuto="自动（优先 DirectML）"
DeviceDml="DirectML"
DeviceCpu="CPU"
Conf="置信度阈值"
Conf.Desc="低于该分数的目标不予检测。调高减少误遮，调低提高召回。"
Iou="NMS IoU 阈值"
MaxDet="单帧最多目标数"
ClassFilter="目标类别"
ClassFilter.Desc="留空 = 全部类别。可填类别名或索引，逗号分隔，例如：person, cell phone, 67"

Sec.Mask="④ 遮罩样式"
MaskKind="遮罩方式"
MaskSolid="纯色（高危推荐）"
MaskBlur="模糊"
MaskMosaic="马赛克"
MaskKind.Desc="纯色最安全，无法被生成模型还原。模糊只建议用于中低风险；高危内容请用纯色或马赛克。"
MaskColor="颜色"
MaskOpacity="不透明度"
BlurPx="模糊半径（1080p 基准）"
BlockPx="马赛克块大小（1080p 基准）"
Expand="框体外扩比例"
PadPx="额外边距（像素）"

Sec.Smooth="⑤ 平滑"
HoldMs="目标消失后保持"
FadeMs="淡出时长"

Sec.Debug="⑥ 诊断"
DebugRoi="显示检测区域边框"
DebugBox="显示命中框"
DebugConf="显示置信度"
DebugConf.Desc="在每个命中框左上角叠加两位读数（置信度 x100）。仅用于调试，会进入推流画面，正式直播前请关闭。"
Status="推理状态"
Refresh="刷新状态"
TestMask="测试遮罩"
TestMask.Desc="点击后在当前检测区域叠加 3 秒样本遮罩，用于确认挂载、坐标与样式是否正常，不依赖模型。"
