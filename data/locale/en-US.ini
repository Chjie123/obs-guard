Name="Content Mask"
Description="Real-time detection and masking of prohibited content, before OBS encodes the frame"

Sec.Basic="1. General"
Enabled="Enable detection"
DetFps="Detection rate"
DetFps.Desc="Inference per second. Masks are still drawn every frame, so lowering this only reduces GPU/CPU load."
FailMode="On inference failure"
FailOpen="Pass through (keep streaming)"
FailClosed="Full-screen mask (keep compliant)"
FailMode.Desc="fail-open stops masking and passes frames through with a warning. fail-closed keeps a full-screen mask until recovery. Default: fail-open."

Sec.Roi="2. Detection region"
CoordMode="Coordinate space"
CoordPercent="Percent (resolution independent)"
CoordPixel="Pixels (source space)"
CoordMode.Desc="Percent: 0-100%%, survives resolution changes. Pixels: relative to the current source size; with a Display Capture source, pixel coordinates equal screen coordinates."
RoiHint="Region is measured from the top-left corner. Detection and masking happen only inside this region."
RoiX="X"
RoiY="Y"
RoiW="Width"
RoiH="Height"
RoiPct.Desc="Unit: percentage of frame width/height."
RoiPx.Desc="Unit: pixels. Re-enter after changing source resolution."

Sec.Model="3. Model"
ModelPath="YOLO model (.onnx)"
ModelFilter="ONNX model (*.onnx)"
ModelPath.Desc="Export from .pt with tools/export_onnx.py. Input size is read from the graph; class names are read from model metadata."
Device="Device"
DeviceAuto="Auto (prefer DirectML)"
DeviceDml="DirectML"
DeviceCpu="CPU"
Conf="Confidence threshold"
Conf.Desc="Detections below this score are dropped. Raise to reduce false masks, lower to improve recall."
Iou="NMS IoU threshold"
MaxDet="Max detections per frame"
ClassFilter="Target classes"
ClassFilter.Desc="Empty = all classes. Names or indices, comma separated, e.g. person, cell phone, 67"

Sec.Mask="4. Mask style"
MaskKind="Mask type"
MaskSolid="Solid color (safest)"
MaskBlur="Blur"
MaskMosaic="Mosaic"
MaskKind.Desc="Solid color cannot be reconstructed by generative models. Blur is only for low-risk use; prefer solid or mosaic for high-risk content."
MaskColor="Color"
MaskOpacity="Opacity"
BlurPx="Blur radius (at 1080p)"
BlockPx="Mosaic block (at 1080p)"
Expand="Box expansion"
PadPx="Extra padding (px)"

Sec.Smooth="5. Smoothing"
HoldMs="Hold after loss"
FadeMs="Fade out"

Sec.Debug="6. Diagnostics"
DebugRoi="Show detection region"
DebugBox="Show hit boxes"
DebugConf="Show confidence"
DebugConf.Desc="Overlays a two-digit confidence readout (score x100) on each hit box. For debugging only: it becomes part of the output image, turn it off before going live."
Status="Inference status"
Refresh="Refresh status"
TestMask="Test mask"
TestMask.Desc="Overlays a sample mask on the detection region for 3 seconds to verify mounting, coordinates and style without a model."
